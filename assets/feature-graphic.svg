<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="phoneScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <mask id="moonLit">
      <rect width="1024" height="500" fill="black"/>
      <circle cx="188" cy="250" r="108" fill="white"/>
      <circle cx="248" cy="250" r="108" fill="black"/>
    </mask>
    <mask id="phoneMoonLit">
      <rect width="1024" height="500" fill="black"/>
      <circle cx="832" cy="188" r="34" fill="white"/>
      <circle cx="850" cy="188" r="34" fill="black"/>
    </mask>
    <radialGradient id="moonShade" cx="62%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Subtle stars -->
  <circle cx="90" cy="72" r="1.5" fill="#fef3c7" fill-opacity="0.22"/>
  <circle cx="140" cy="110" r="1" fill="#f59e0b" fill-opacity="0.28"/>
  <circle cx="520" cy="48" r="1.2" fill="#fef3c7" fill-opacity="0.18"/>
  <circle cx="610" cy="88" r="1" fill="#f59e0b" fill-opacity="0.2"/>
  <circle cx="960" cy="420" r="1.5" fill="#fef3c7" fill-opacity="0.2"/>
  <circle cx="48" cy="390" r="1" fill="#f59e0b" fill-opacity="0.25"/>

  <!-- Decorative orbit ring -->
  <circle cx="188" cy="250" r="156" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="6 10"/>

  <!-- Hero moon -->
  <circle cx="188" cy="250" r="152" fill="#f59e0b" fill-opacity="0.1"/>
  <circle cx="188" cy="250" r="132" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="188" cy="250" r="108" fill="#fef3c7" mask="url(#moonLit)"/>
  <circle cx="188" cy="250" r="108" fill="url(#moonShade)" mask="url(#moonLit)"/>

  <!-- Brand -->
  <text
    x="340"
    y="168"
    font-family="Segoe UI, system-ui, sans-serif"
    font-size="30"
    font-weight="600"
    fill="#f59e0b"
    letter-spacing="0.4"
  >Chandra Darshan</text>

  <!-- Hero headline -->
  <text
    x="340"
    y="228"
    font-family="Segoe UI, system-ui, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#fef3c7"
    letter-spacing="-0.8"
  >Hindu Panchang</text>
  <text
    x="340"
    y="278"
    font-family="Segoe UI, system-ui, sans-serif"
    font-size="46"
    font-weight="700"
    fill="#fef3c7"
    letter-spacing="-0.8"
  >&amp; Moon Today</text>

  <!-- Supporting line -->
  <text
    x="340"
    y="322"
    font-family="Segoe UI, system-ui, sans-serif"
    font-size="24"
    font-weight="400"
    fill="#f59e0b"
    letter-spacing="0.2"
  >Offline · Tithi · Nakshatra · Jyotish</text>

  <!-- Feature pills -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="340" y="346" width="136" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="408" y="368" text-anchor="middle" fill="#fef3c7">Offline Panchang</text>

    <rect x="484" y="346" width="112" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="540" y="368" text-anchor="middle" fill="#fef3c7">Birth Jyotish</text>

    <rect x="604" y="346" width="96" height="34" rx="17" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.35"/>
    <text x="652" y="368" text-anchor="middle" fill="#fef3c7">5 Languages</text>
  </g>

  <!-- Phone mockup -->
  <g filter="url(#phoneShadow)">
    <rect x="718" y="58" width="262" height="384" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="736" y="88" width="226" height="324" rx="18" fill="url(#phoneScreen)" stroke="#334155" stroke-width="1"/>

    <!-- Status bar -->
    <rect x="756" y="104" width="42" height="5" rx="2.5" fill="#475569" fill-opacity="0.8"/>
    <circle cx="944" cy="106" r="4" fill="#475569" fill-opacity="0.8"/>

    <!-- App title in mock -->
    <text x="849" y="142" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f59e0b">Chandra Darshan</text>

    <!-- Mini moon -->
    <circle cx="832" cy="188" r="48" fill="#f59e0b" fill-opacity="0.12"/>
    <circle cx="832" cy="188" r="34" fill="#fef3c7" mask="url(#phoneMoonLit)"/>

    <!-- Panchang rows -->
    <text x="756" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">Tithi</text>
    <text x="918" y="252" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">Dashami</text>
    <line x1="756" y1="260" x2="942" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="756" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">Paksha</text>
    <text x="918" y="284" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">Shukla</text>
    <line x1="756" y1="292" x2="942" y2="292" stroke="#334155" stroke-width="1"/>

    <text x="756" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">Nakshatra</text>
    <text x="918" y="316" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">Rohini</text>
    <line x1="756" y1="324" x2="942" y2="324" stroke="#334155" stroke-width="1"/>

    <text x="756" y="348" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#94a3b8">Maasa</text>
    <text x="918" y="348" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fef3c7">Chaitra</text>

    <!-- Bottom nav hint -->
    <rect x="772" y="378" width="72" height="20" rx="10" fill="#f59e0b" fill-opacity="0.22"/>
    <text x="808" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#fef3c7">Today</text>
    <rect x="860" y="378" width="72" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="896" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#94a3b8">Jyotish</text>
  </g>
</svg>

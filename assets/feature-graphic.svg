<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <mask id="moonLit">
      <rect width="1024" height="500" fill="black"/>
      <circle cx="230" cy="250" r="118" fill="white"/>
      <circle cx="296" cy="250" r="118" fill="black"/>
    </mask>
    <radialGradient id="moonShade" cx="62%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Accent dots -->
  <circle cx="880" cy="90" r="2" fill="#f59e0b" fill-opacity="0.35"/>
  <circle cx="920" cy="130" r="1.5" fill="#fef3c7" fill-opacity="0.25"/>
  <circle cx="960" cy="80" r="1" fill="#fef3c7" fill-opacity="0.2"/>
  <circle cx="70" cy="420" r="1.5" fill="#f59e0b" fill-opacity="0.3"/>
  <circle cx="110" cy="390" r="1" fill="#fef3c7" fill-opacity="0.2"/>

  <!-- Moon glow -->
  <circle cx="230" cy="250" r="168" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="230" cy="250" r="148" fill="none" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- Moon disc -->
  <circle cx="230" cy="250" r="118" fill="#fef3c7" mask="url(#moonLit)"/>
  <circle cx="230" cy="250" r="118" fill="url(#moonShade)" mask="url(#moonLit)"/>

  <!-- Title -->
  <text
    x="400"
    y="228"
    font-family="Segoe UI, system-ui, sans-serif"
    font-size="54"
    font-weight="700"
    fill="#fef3c7"
    letter-spacing="-0.5"
  >Chandra Darshan</text>

  <!-- Subtitle -->
  <text
    x="400"
    y="282"
    font-family="Segoe UI, system-ui, sans-serif"
    font-size="26"
    font-weight="400"
    fill="#f59e0b"
    letter-spacing="0.2"
  >Moon Panchang &amp; Offline Jyotish</text>

  <!-- Accent line -->
  <rect x="400" y="304" width="120" height="3" rx="1.5" fill="#f59e0b" fill-opacity="0.55"/>
</svg>
